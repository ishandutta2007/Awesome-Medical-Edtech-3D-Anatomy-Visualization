<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#06101e"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.05); }
      }
      @keyframes scanline {
        0% { transform: translateY(-300px); }
        100% { transform: translateY(400px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes ecgBeat {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .bg-grid {
        stroke: #1e293b;
        stroke-width: 0.8;
        opacity: 0.45;
      }
      .floating-card {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .glowing-circle {
        animation: pulseGlow 5s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .ecg-line {
        stroke-dasharray: 800;
        animation: ecgBeat 4s linear infinite;
      }
      .orbit-group {
        transform-origin: 1040px 180px;
        animation: orbitRotate 22s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Medical Mesh Grid -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Ambient Glow Orbs in Background -->
  <circle cx="1040" cy="180" r="110" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="glowing-circle" />
  <circle cx="180" cy="120" r="90" fill="#818cf8" opacity="0.1" filter="url(#glow)" class="glowing-circle" />

  <!-- Dynamic Rotating 3D Wireframe / Orbit Geometry (Positioned on the Right Side) -->
  <g class="orbit-group">
    <ellipse cx="1040" cy="180" rx="90" ry="35" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" transform="rotate(-25 1040 180)" />
    <ellipse cx="1040" cy="180" rx="90" ry="35" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" transform="rotate(35 1040 180)" />
    <ellipse cx="1040" cy="180" rx="90" ry="35" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5" transform="rotate(95 1040 180)" />
    <circle cx="950" cy="180" r="4.5" fill="#38bdf8" />
    <circle cx="1130" cy="180" r="4.5" fill="#c084fc" />
    <circle cx="1040" cy="95" r="4" fill="#34d399" />
  </g>

  <!-- Central Right Holographic Anatomy Icon (DNA & Wireframe Voxel) -->
  <g transform="translate(1005, 145)">
    <!-- 3D Polyhedral Wireframe Cube/Prism -->
    <polygon points="35,5 65,22 35,40 5,22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6" opacity="0.85"/>
    <polygon points="5,22 35,40 35,75 5,55" fill="#0f172a" stroke="#818cf8" stroke-width="1.6" opacity="0.85"/>
    <polygon points="65,22 35,40 35,75 65,55" fill="#090d16" stroke="#c084fc" stroke-width="1.6" opacity="0.85"/>
  </g>

  <!-- Animated ECG Waveform (Background / Midground Accent) -->
  <path class="ecg-line" d="M 50 315 L 280 315 L 300 295 L 315 340 L 335 270 L 350 325 L 365 315 L 850 315 L 870 298 L 885 338 L 905 272 L 920 322 L 935 315 L 1150 315" fill="none" stroke="#06b6d4" stroke-width="1.8" opacity="0.4" />

  <!-- Floating Tech Badges / Pills (Dynamic Animated Floating) -->
  <g class="floating-card">
    <!-- Pill 1: 3D Visualization -->
    <rect x="75" y="42" width="168" height="32" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <circle cx="92" cy="58" r="5" fill="#38bdf8" />
    <text x="106" y="63" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">3D Visualization</text>

    <!-- Pill 2: Virtual Dissection -->
    <rect x="255" y="42" width="170" height="32" rx="16" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" opacity="0.9" />
    <circle cx="272" cy="58" r="5" fill="#818cf8" />
    <text x="286" y="63" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">Virtual Dissection</text>

    <!-- Pill 3: Open-Source BioTech -->
    <rect x="437" y="42" width="180" height="32" rx="16" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" opacity="0.9" />
    <circle cx="454" cy="58" r="5" fill="#34d399" />
    <text x="468" y="63" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">Open-Source EdTech</text>
  </g>

  <!-- FOREGROUND: TITLE & SUBTITLE (Always perfectly crisp and readable) -->
  <g transform="translate(75, 120)">
    <!-- Top Micro Tagline -->
    <text x="0" y="24" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="13.5" font-weight="700" letter-spacing="2.5" fill="#38bdf8" text-transform="uppercase">
      CURATED MEDICAL EDTECH &amp; DIGITAL ANATOMY
    </text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      3D Anatomy Visualization
    </text>

    <!-- Subtitle -->
    <text x="0" y="118" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Interactive Clinical Atlases, Virtual Dissection Suites &amp; Open-Source Medical Rendering Engines
    </text>

    <!-- Stat Badges / Features -->
    <g transform="translate(0, 142)">
      <text x="0" y="18" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
        ⚡ Top SaaS Platforms &amp; Institutional Suites &nbsp;•&nbsp; 🌟 18+ Active Open-Source Repositories &nbsp;•&nbsp; 🔬 Clinical-Grade DICOM / 3D Meshes
      </text>
    </g>
  </g>
</svg>
